# Builds Dissolve on a GitHub macOS runner, runs the Engine tests, launches the app
# in the iOS Simulator and publishes screenshots to the `screenshots` branch.
name: Build & screenshots

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: bash  # -eo pipefail, so xcodebuild failures aren't hidden by xcbeautify

env:
  BUNDLE_ID: com.lohith.dissolve
  DERIVED: ${{ github.workspace }}/build

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Prefer Xcode 27 (the real iOS/macOS 27 target). Until GitHub's images ship it,
        # fall back to the newest Xcode 26 and build this CI copy with a 26.0 deployment target.
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then
            echo "DEPLOY_OVERRIDE=" >> "$GITHUB_ENV"
          else
            # Use the Xcode that matches the newest installed iOS simulator runtime.
            IOS=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          rs = [r["version"] for r in json.load(sys.stdin)["runtimes"]
                if r["platform"] == "iOS" and r["isAvailable"] and r["version"].startswith("26.")]
          v = sorted(rs, key=lambda v: [int(x) for x in v.split(".")])[-1]
          print(".".join(v.split(".")[:2]))')
            echo "Newest iOS simulator runtime: $IOS"
            XC=$(ls -d /Applications/Xcode_${IOS}*.app 2>/dev/null | sort -V | tail -1)
            [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
            echo "::warning::No Xcode 27 on the runner; CI builds with $(basename "$XC") and a 26.0 deployment target."
            echo "DEPLOY_OVERRIDE=IPHONEOS_DEPLOYMENT_TARGET=26.0 MACOSX_DEPLOYMENT_TARGET=26.0" >> "$GITHUB_ENV"
          fi
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Engine tests
        run: swift test --package-path Engine

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for macOS
        run: |
          xcodebuild -project Dissolve.xcodeproj -scheme Dissolve \
            -destination 'generic/platform=macOS' -derivedDataPath "$DERIVED" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= $DEPLOY_OVERRIDE \
            build | xcbeautify

      - name: Pick and boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if ".iOS-" in r),
                            key=lambda r: [int(x) for x in r.rsplit("iOS-", 1)[1].split("-")])
          phones = [d for d in devices[runtimes[-1]] if d["name"].startswith("iPhone")]
          pro = [d for d in phones if d["name"].endswith("Pro")]
          print(sorted(pro or phones, key=lambda d: d["name"])[-1]["udid"])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 --batteryState charged --cellularBars 4 --wifiBars 3

      - name: Build for iOS Simulator
        run: |
          xcodebuild -project Dissolve.xcodeproj -scheme Dissolve \
            -destination "id=$UDID" -derivedDataPath "$DERIVED" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= $DEPLOY_OVERRIDE \
            build | xcbeautify

      - name: iOS screenshots
        run: |
          mkdir -p shots
          xcrun simctl install "$UDID" "$DERIVED/Build/Products/Debug-iphonesimulator/Dissolve.app"
          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance "$mode"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID"
            sleep 8
            xcrun simctl io "$UDID" screenshot "shots/ios-$mode.png"
          done

      - name: macOS screenshot
        continue-on-error: true
        run: |
          APP="$DERIVED/Build/Products/Debug/Dissolve.app"
          open "$APP"
          sleep 10
          screencapture -x shots/mac.png
          osascript -e 'quit app "Dissolve"' || true

      - name: Publish to screenshots branch
        if: github.event_name != 'pull_request'
        run: |
          cd shots
          printf '# Screenshots\n\nCommit %s · %s\n' "$GITHUB_SHA" "$(date -u '+%Y-%m-%d %H:%M UTC')" > README.md
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
          if-no-files-found: ignore
