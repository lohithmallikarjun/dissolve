# Builds Dissolve on a GitHub macOS runner, runs the Engine tests, launches the app
# in the iOS Simulator and publishes screenshots to the `screenshots` branch.
name: Build & screenshots

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: bash  # -eo pipefail, so xcodebuild failures aren't hidden by xcbeautify

env:
  BUNDLE_ID: com.lohith.dissolve
  DERIVED: ${{ github.workspace }}/build

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: scripts/ci-select-xcode.sh

      - name: Engine tests
        run: swift test --package-path Engine

      - name: Generate project
        run: |
          brew install xcodegen
          # Without Xcode 27, lower this CI copy's target so the iOS 26 simulators are eligible.
          if [ -n "$DEPLOY_OVERRIDE" ]; then sed -i '' 's/"27.0"/"26.0"/' project.yml; fi
          xcodegen generate

      - name: Build for macOS
        run: |
          xcodebuild -project Dissolve.xcodeproj -scheme Dissolve \
            -destination 'generic/platform=macOS' -derivedDataPath "$DERIVED" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= $DEPLOY_OVERRIDE \
            build | xcbeautify

      - name: Pick and boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if ".iOS-" in r),
                            key=lambda r: [int(x) for x in r.rsplit("iOS-", 1)[1].split("-")])
          phones = [d for d in devices[runtimes[-1]] if d["name"].startswith("iPhone")]
          pro = [d for d in phones if d["name"].endswith("Pro")]
          print(sorted(pro or phones, key=lambda d: d["name"])[-1]["udid"])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 --batteryState charged --cellularBars 4 --wifiBars 3

      - name: Build for iOS Simulator
        run: |
          xcodebuild -project Dissolve.xcodeproj -scheme Dissolve \
            -destination "id=$UDID" -derivedDataPath "$DERIVED" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= $DEPLOY_OVERRIDE \
            build | xcbeautify

      - name: iOS screenshots
        run: |
          mkdir -p shots/widgets
          xcrun simctl install "$UDID" "$DERIVED/Build/Products/Debug-iphonesimulator/Dissolve.app"
          launch() {
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" "$@"
          }
          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance "$mode"
            launch -demoData -widgetGallery -section:today
            sleep 10
            xcrun simctl io "$UDID" screenshot "shots/ios-today-$mode.png"
            launch -section:progress
            sleep 7
            xcrun simctl io "$UDID" screenshot "shots/ios-progress-$mode.png"
          done
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          cp "$DATA"/Documents/widget-gallery/*.png shots/widgets/ || echo "::warning::No widget gallery images"

      - name: macOS screenshot
        continue-on-error: true
        run: |
          APP="$DERIVED/Build/Products/Debug/Dissolve.app"
          # Plain launch first, to compare.
          "$APP/Contents/MacOS/Dissolve" > shots/mac-log-plain.txt 2>&1 &
          PID=$!
          sleep 10
          screencapture -x shots/mac-plain.png
          kill "$PID" || true
          sleep 2
          "$APP/Contents/MacOS/Dissolve" -demoData -section:progress > shots/mac-log.txt 2>&1 &
          PID=$!
          sleep 15
          osascript -e 'tell application "System Events" to get {name, position, size} of every window of (first process whose unix id is '"$PID"')' > shots/mac-windows.txt 2>&1 || true
          ps -o pid,%cpu,state,command -p "$PID" >> shots/mac-windows.txt || echo "process exited" >> shots/mac-windows.txt
          sample "$PID" 2 -file shots/mac-sample.txt >/dev/null 2>&1 || true
          screencapture -x shots/mac.png
          kill "$PID" || true
          cat shots/mac-windows.txt
          echo "--- plain"; cat shots/mac-log-plain.txt
          echo "--- with args"; cat shots/mac-log.txt

      - name: Publish to screenshots branch
        if: github.event_name != 'pull_request'
        run: |
          cd shots
          printf '# Screenshots\n\nCommit %s · %s\n' "$GITHUB_SHA" "$(date -u '+%Y-%m-%d %H:%M UTC')" > README.md
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
          if-no-files-found: ignore
